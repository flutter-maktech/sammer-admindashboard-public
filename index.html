<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NEXTPRIME Dashboard">

  <!-- Cache busting -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS / PWA meta -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEXTPRIME">
  <meta name="theme-color" content="#111111" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.ico" />

  <title>NEXTPRIME</title>
  <link rel="manifest" href="manifest.json">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden;
      color: #f8fafc;
    }

    /* ── Subtle Background Glow ── */
    #bg-accent {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Minimalist Loader ── */
    #loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 10;
      perspective: 1000px;
    }

    .logo-container {
      position: relative;
      margin-bottom: 40px;
      animation: floatLogo 3s ease-in-out infinite;
    }

    .app-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 0 15px rgba(14, 165, 233, 0.4));
    }

    .logo-pulse {
      position: absolute;
      inset: 0;
      background: rgba(14, 165, 233, 0.2);
      border-radius: 50%;
      filter: blur(25px);
      z-index: -1;
      animation: softPulse 2s ease-in-out infinite;
    }

    @keyframes floatLogo {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes softPulse {

      0%,
      100% {
        transform: scale(0.85);
        opacity: 0.2;
      }

      50% {
        transform: scale(1.15);
        opacity: 0.6;
      }
    }

    /* ── Typography ── */
    .brand-name {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .brand-accent {
      color: #0ea5e9;
      margin-right: -2px;
    }

    .status-text {
      font-size: 14px;
      color: #64748b;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }

    /* ── Sleek Progress Bar ── */
    .progress-wrap {
      width: 260px;
      height: 5px;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #0ea5e9, #38bdf8, #0ea5e9);
      background-size: 200% 100%;
      border-radius: 10px;
      animation: slideProgress 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideProgress {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);
      }
    }

    /* ── Footer ── */
    .footer-info {
      position: fixed;
      bottom: 40px;
      font-size: 11px;
      color: #334155;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div id="bg-accent"></div>

  <div id="loader">
    <div class="logo-container">
      <div class="logo-pulse"></div>
      <img class="app-logo" src="assets/asset/image/appLogo.png" alt="NEXTPRIME" onerror="this.style.display='none'" />
    </div>

    <div class="brand-name"><span class="brand-accent">NEXT</span>PRIME</div>
    <div class="status-text">Synchronizing application core...</div>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>

    <div class="footer-info">NEXTPRIME ENTERPRISE DASHBOARD &bull; 2026</div>
  </div>



  <!-- Flutter bootstrap -->
  <script src="flutter_bootstrap.js"></script>

  <script>

    (async function () {

      const VERSION_KEY = "__APP_VERSION__";

      try {

        const response = await fetch(
          "flutter_bootstrap.js?v=" + Date.now(),
          { cache: "no-store" }
        );

        const text = await response.text();

        let hash = 0;

        for (let i = 0; i < text.length; i++) {
          hash = ((hash << 5) - hash) + text.charCodeAt(i);
          hash |= 0;
        }

        const newVersion = hash.toString();
        const oldVersion = localStorage.getItem(VERSION_KEY);

        if (oldVersion !== newVersion) {

          console.log("[CACHE] New version detected");

          // unregister service workers
          if ("serviceWorker" in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for (const reg of regs) {
              await reg.unregister();
            }
          }

          // clear caches
          if ("caches" in window) {
            const keys = await caches.keys();
            for (const key of keys) {
              await caches.delete(key);
            }
          }

          sessionStorage.clear();
          localStorage.setItem(VERSION_KEY, newVersion);

          window.location.replace(
            window.location.pathname + "?v=" + Date.now()
          );

          return;
        }

      } catch (e) {
        console.log("[CACHE ERROR]", e);
      }

    })();

    // remove loader
    function removeLoader() {
      const loader = document.getElementById("loader");
      if (loader) {
        loader.style.opacity = "0";
        loader.style.transform = "scale(0.95)";
        setTimeout(() => loader.remove(), 400);
      }
    }

    window.addEventListener("flutter-first-frame", removeLoader);

    window.addEventListener("load", function () {

      _flutter.loader.load({

        serviceWorker: {
          serviceWorkerUrl: "custom_service_worker.js",
          timeout: 30000
        },

        onEntrypointLoaded: async function (engineInitializer) {

          const appRunner = await engineInitializer.initializeEngine({
            renderer: "canvaskit",
            useColorEmoji: true
          });

          removeLoader();

          await appRunner.runApp();
        }

      });

    });

    navigator.serviceWorker?.addEventListener(
      "message",
      (event) => {
        if (event.data?.type === "SW_UPDATED") {
          console.log("[SW] Update detected → reloading...");
          window.location.reload();
        }
      }
    );

  </script>




</body>

</html>
